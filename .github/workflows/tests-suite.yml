name: Test Suite (reusable)

on:
  workflow_call:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest']
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          # No Python 3.8/3.9 builds for ubuntu-26.04 (ubuntu-latest from November 2026)
          - os: 'ubuntu-24.04'
            python-version: '3.8'
          - os: 'ubuntu-24.04'
            python-version: '3.9'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests]

      - name: Run pytest unit tests
        run: |
          ./bin/checks.sh pytest

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run non-regression tests
        run: |
          ./bin/checks.sh examples

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .[tests]

      - name: lint_flake8
        run: |
          ./bin/checks.sh flake8

      - name: lint_pylint
        run: |
          ./bin/checks.sh pylint

  version_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ensure release tag is known to git
        run: |
          git fetch --tags --force

      - name: Check version consistency
        run: |
          ./bin/checks.sh version

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check Doxygen documentation
        run: |
          if command -v doxygen &> /dev/null; then
            cd doc/doxygen && doxygen doxygen_config
            echo "Doxygen documentation generated successfully"
          else
            echo "Doxygen not installed, skipping documentation build"
          fi
